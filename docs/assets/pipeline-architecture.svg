<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 390" width="1120" height="390" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Pretendard, Inter, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eef2ff"/>
    </linearGradient>
    <linearGradient id="blueHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="emeraldHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="amberHeader" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c2410c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="cardShadow" x="-6%" y="-6%" width="112%" height="116%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#4f46e5"/>
    </marker>
    <marker id="arrowTeal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,1 L9,5 L0,9 Z" fill="#0d9488"/>
    </marker>
  </defs>

  <!-- Canvas -->
  <rect x="0" y="0" width="1120" height="390" rx="18" fill="url(#bgGrad)" stroke="#cbd5e1" stroke-width="1.5"/>

  <!-- Top Banner Pill -->
  <rect x="330" y="18" width="460" height="30" rx="15" fill="#e0e7ff" stroke="#a5b4fc" stroke-width="1"/>
  <text x="560" y="38" text-anchor="middle" font-size="12.5" font-weight="700" fill="#3730a3">
    PaperView End-to-End Local Research Pipeline · Zero API Key Billing
  </text>

  <!-- Stage 1: Smart PDF Pre-Processor -->
  <g filter="url(#cardShadow)">
    <rect x="34" y="68" width="240" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="34" y="68" width="240" height="44" rx="14" fill="url(#blueHeader)"/>
    <rect x="34" y="96" width="240" height="16" fill="url(#blueHeader)"/>
    <text x="154" y="95" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">1. PDF Layout &amp; Media Parser</text>

    <rect x="50" y="128" width="208" height="44" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="154" y="147" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">1-Col / 2-Col 자동 감지</text>
    <text x="154" y="163" text-anchor="middle" font-size="10.5" fill="#475569">NeurIPS · IEEE · 혼합 부록 정밀 정렬</text>

    <rect x="50" y="182" width="208" height="44" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="154" y="201" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">Figure · Table 고해상도 크롭</text>
    <text x="154" y="217" text-anchor="middle" font-size="10.5" fill="#475569">180~200 DPI PNG 추출 및 캡션 매칭</text>

    <rect x="50" y="236" width="208" height="44" rx="8" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="154" y="255" text-anchor="middle" font-size="12" font-weight="700" fill="#0f172a">양방향 BBox 좌표 인덱싱</text>
    <text x="154" y="271" text-anchor="middle" font-size="10.5" fill="#475569">원본 PDF 줄 ↔ 번역 문장 클릭 동기화</text>

    <rect x="50" y="290" width="208" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="154" y="309" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">야간 예약 번역 큐 (Queue)</text>
    <text x="154" y="325" text-anchor="middle" font-size="10.5" fill="#3b82f6">다중 PDF 예약 · 한도 초기화 자동 재개</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <line x1="278" y1="209" x2="318" y2="209" stroke="#4f46e5" stroke-width="2.4" marker-end="url(#arrowBlue)"/>

  <!-- Stage 2: Local Subscription AI Engine -->
  <g filter="url(#cardShadow)">
    <rect x="326" y="68" width="256" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="326" y="68" width="256" height="44" rx="14" fill="url(#amberHeader)"/>
    <rect x="326" y="96" width="256" height="16" fill="url(#amberHeader)"/>
    <text x="454" y="95" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">2. Local Subscription AI Router</text>

    <rect x="342" y="128" width="224" height="50" rx="8" fill="#fff7ed" stroke="#fed7aa"/>
    <text x="454" y="148" text-anchor="middle" font-size="12" font-weight="800" fill="#c2410c">Claude Code CLI (OAuth)</text>
    <text x="454" y="166" text-anchor="middle" font-size="10.5" fill="#9a3412">opus[1m] · sonnet · 추론 강도 · 잔여 한도 %</text>

    <rect x="342" y="188" width="224" height="50" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
    <text x="454" y="208" text-anchor="middle" font-size="12" font-weight="800" fill="#047857">OpenAI Codex CLI (ChatGPT)</text>
    <text x="454" y="226" text-anchor="middle" font-size="10.5" fill="#065f46">gpt-5.4 · o3 · o4-mini · 구독 세션 연동</text>

    <rect x="342" y="248" width="224" height="44" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="454" y="267" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Antigravity SDK (선택)</text>
    <text x="454" y="283" text-anchor="middle" font-size="10.5" fill="#1e40af">Gemini 모델 패밀리 실시간 연동</text>

    <rect x="342" y="302" width="224" height="34" rx="8" fill="#fef2f2" stroke="#fecaca"/>
    <text x="454" y="323" text-anchor="middle" font-size="11" font-weight="700" fill="#b91c1c">🔒 API Key 강제 차단 (추가 요금 $0)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <line x1="586" y1="209" x2="626" y2="209" stroke="#0d9488" stroke-width="2.4" marker-end="url(#arrowTeal)"/>

  <!-- Stage 3: Interactive Split Workspace -->
  <g filter="url(#cardShadow)">
    <rect x="634" y="68" width="452" height="282" rx="14" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
    <rect x="634" y="68" width="452" height="44" rx="14" fill="url(#emeraldHeader)"/>
    <rect x="634" y="96" width="452" height="16" fill="url(#emeraldHeader)"/>
    <text x="860" y="95" text-anchor="middle" font-size="13.5" font-weight="800" fill="#ffffff">3. Interactive Split-Pane Paper Workspace (Web + VS Code)</text>

    <!-- 2x2 Grid inside Stage 3 -->
    <rect x="652" y="128" width="202" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="666" y="150" font-size="12" font-weight="800" fill="#0f172a">✦ Step 0 핵심 요약 &amp; Contribution</text>
    <text x="666" y="170" font-size="10.8" fill="#475569">• 번역 시작 즉시 최상단 요약 카드 생성</text>
    <text x="666" y="188" font-size="10.8" fill="#475569">• TL;DR + 핵심 기여 1·2·3 구조화</text>
    <text x="666" y="206" font-size="10.8" fill="#475569">• 문제 정의 · 방법론 · 실험 성과 요약</text>

    <rect x="868" y="128" width="200" height="96" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="882" y="150" font-size="12" font-weight="800" fill="#0f172a">∑ 실시간 전문 번역 &amp; KaTeX 수식</text>
    <text x="882" y="170" font-size="10.8" fill="#475569">• 온전한 영어 원문 + 평어체 학술 번역</text>
    <text x="882" y="188" font-size="10.8" fill="#475569">• 깨진 PDF 수식 → LaTeX 자동 복원</text>
    <text x="882" y="206" font-size="10.8" fill="#475569">• 본문 내 Figure · Table 확대 뷰어</text>

    <rect x="652" y="238" width="202" height="96" rx="10" fill="#f0fdf4" stroke="#bbf7d0"/>
    <text x="666" y="260" font-size="12" font-weight="800" fill="#166534">[N] arXiv 우선 인용 요약 &amp; 알림</text>
    <text x="666" y="280" font-size="10.8" fill="#15803d">• IEEE 인용도 제목으로 arXiv 먼저 탐색</text>
    <text x="666" y="298" font-size="10.8" fill="#15803d">• 원문 PDF + Main Figure 자동 추출</text>
    <text x="666" y="316" font-size="10.8" fill="#15803d">• 창 닫아도 백그라운드 요약 완료 토스트</text>

    <rect x="868" y="238" width="200" height="96" rx="10" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="882" y="260" font-size="12" font-weight="800" fill="#1e40af">💬 크기 조절 간결 논문 Q&amp;A</text>
    <text x="882" y="280" font-size="10.8" fill="#1d4ed8">• 논문 전문 + 캡션 + 참고문헌 기반 답변</text>
    <text x="882" y="298" font-size="10.8" fill="#1d4ed8">• 드래그 너비 조절 &amp; 간결/상세 스위치</text>
    <text x="882" y="316" font-size="10.8" fill="#1d4ed8">• 선택 문장 · Figure 핀(📌) 첨부 질문</text>
  </g>
</svg>
